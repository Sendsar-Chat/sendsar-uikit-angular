@if (open) {
  <div class="backdrop" (click)="close()">
    <div class="dialog" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
      <header class="dialog-header">
        <h2>New conversation</h2>
        <button type="button" class="close" (click)="close()" aria-label="Close">×</button>
      </header>

      <div class="tabs">
        <button
          type="button"
          [class.active]="tab() === 'direct'"
          (click)="setTab('direct')"
        >
          Direct message
        </button>
        <button
          type="button"
          [class.active]="tab() === 'group'"
          (click)="setTab('group')"
        >
          Group
        </button>
      </div>

      @if (tab() === 'direct') {
        <div class="panel">
          <p class="hint">Pick someone to message 1:1.</p>
          <ul class="user-list">
            @for (user of peers(); track user.chatUserId) {
              <li>
                <label class="user-row">
                  <input
                    type="radio"
                    name="peer"
                    [value]="user.chatUserId"
                    [checked]="selectedPeerId() === user.chatUserId"
                    (change)="selectedPeerId.set(user.chatUserId)"
                  />
                  <span class="avatar">{{ user.displayName.slice(0, 2).toUpperCase() }}</span>
                  <span class="name">
                    {{ user.displayName }}
                    @if (isOnline(user.chatUserId)) {
                      <span class="online">online</span>
                    }
                  </span>
                </label>
              </li>
            }
          </ul>
          <footer class="dialog-footer">
            <button type="button" class="secondary" (click)="close()">Cancel</button>
            <button
              type="button"
              class="primary"
              [disabled]="busy || !selectedPeerId()"
              (click)="submitDirect()"
            >
              {{ busy ? 'Creating…' : 'Start chat' }}
            </button>
          </footer>
        </div>
      } @else {
        <div class="panel">
          <label class="field">
            Group name
            <input
              #groupNameInput
              type="text"
              placeholder="e.g. Shop team"
              [disabled]="busy"
            />
          </label>
          <p class="hint">Select members (including you).</p>
          <ul class="user-list">
            @for (user of peers(); track user.chatUserId) {
              <li>
                <label class="user-row">
                  <input
                    type="checkbox"
                    [checked]="isMemberSelected(user.chatUserId)"
                    (change)="toggleMember(user.chatUserId)"
                  />
                  <span class="avatar">{{ user.displayName.slice(0, 2).toUpperCase() }}</span>
                  <span class="name">{{ user.displayName }}</span>
                </label>
              </li>
            }
          </ul>
          <footer class="dialog-footer">
            <button type="button" class="secondary" (click)="close()">Cancel</button>
            <button
              type="button"
              class="primary"
              [disabled]="busy || selectedMembers().size === 0 || !groupNameInput.value.trim()"
              (click)="submitGroup(groupNameInput.value)"
            >
              {{ busy ? 'Creating…' : 'Create group' }}
            </button>
          </footer>
        </div>
      }
    </div>
  </div>
}
