@if (open) {
  <div class="sc-dialog-backdrop" (click)="close()">
    <div
      class="sc-group-dialog"
      role="dialog"
      aria-modal="true"
      aria-label="Group details"
      (click)="$event.stopPropagation()"
    >
      <button type="button" class="sc-group-dialog-close" (click)="close()" aria-label="Close">
        <span class="material-icons" aria-hidden="true">close</span>
      </button>

      <section class="sc-group-dialog-profile">
        <span class="sc-group-dialog-avatar">{{ avatarInitials() }}</span>
        <h2 class="sc-group-dialog-title">{{ title }}</h2>
        <p class="sc-group-dialog-subtitle">{{ memberCount() }} members</p>
        <p class="sc-group-dialog-desc">Group conversation</p>
      </section>

      <section class="sc-group-dialog-members">
        <header class="sc-group-dialog-members-header">
          <h3>Members</h3>
          <button
            type="button"
            class="sc-group-dialog-add-member"
            title="Add member"
            aria-label="Add member"
          >
            <span class="material-icons" aria-hidden="true">person_add</span>
          </button>
        </header>
        @if (members().length > 0) {
          <div class="sc-group-dialog-member-row">
            @for (member of members(); track member.id) {
              <span
                class="sc-group-dialog-member-avatar"
                [class.sc-group-dialog-member-avatar--online]="isOnline(member.id)"
                [title]="member.displayName"
              >
                {{ memberInitials(member) }}
              </span>
            }
          </div>
        } @else {
          <p class="sc-group-dialog-empty">No members to show</p>
        }
      </section>
    </div>
  </div>
}
