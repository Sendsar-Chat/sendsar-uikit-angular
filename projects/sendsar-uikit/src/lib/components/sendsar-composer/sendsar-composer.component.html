<form class="sc-composer" (ngSubmit)="submit()">
  <div class="sc-box">
    @if (pendingFile(); as attachment) {
      <sc-file-preview
        [attachment]="attachment"
        [disabled]="sending() || recording()"
        (removed)="removePendingFile()"
      />
    }

    @if (pendingVoice(); as voice) {
      <sc-voice-preview
        [voice]="voice"
        [disabled]="sending() || recording()"
        (removed)="removePendingVoice()"
      />
    }

    <textarea
      #messageInput
      class="sc-message-input"
      name="message"
      [(ngModel)]="text"
      (ngModelChange)="onTextChange()"
      [disabled]="sending()"
      placeholder="Enter to send Shift + Enter to add new line"
      rows="1"
      autocomplete="off"
      (keydown.enter)="onEnterKey($event)"
    ></textarea>

    @if (showEmojiPicker()) {
      <sc-emoji-picker (emojiSelected)="pickEmoji($event)" />
    }

    <input
      #fileInput
      type="file"
      hidden
      [disabled]="sending() || recording()"
      (change)="onFileSelected($event)"
    />

    @if (recording()) {
      <div class="sc-voice-recording" aria-live="polite">
        <span class="sc-voice-recording-dot" aria-hidden="true"></span>
        <span>Recording {{ recordingSeconds() }}s — tap mic to stop</span>
      </div>
    }

    <div class="sc-toolbar">
      <div class="sc-toolbar-left">
        <button
          type="button"
          class="sc-tool-btn"
          [class.sc-tool-btn--active]="showEmojiPicker()"
          title="Emoji"
          aria-label="Emoji picker"
          [attr.aria-expanded]="showEmojiPicker()"
          (click)="toggleEmojiPicker($event)"
        >
          <span class="material-icons" aria-hidden="true">mood</span>
        </button>

        <button
          type="button"
          class="sc-tool-btn"
          title="Attach"
          (click)="openFilePicker()"
          aria-label="Attach file"
          [disabled]="sending()"
        >
          <span class="material-icons" aria-hidden="true">attach_file</span>
        </button>

        <button
          type="button"
          class="sc-tool-btn"
          title="Voice message"
          aria-label="Voice message"
          [class.sc-tool-btn--active]="recording()"
          [attr.aria-pressed]="recording()"
          [disabled]="sending()"
          (click)="voiceMessage()"
        >
          <span class="material-icons" aria-hidden="true">mic</span>
        </button>

        <button 
          type="button" 
          class="sc-tool-btn" 
          title="Video message" 
          aria-label="Video message" 
          (click)="videoCallMessage()">
            <span class="material-icons" aria-hidden="true">videocam</span>
        </button>
        
      </div>

      <div
        class="sc-send-split"
        [class.sc-send-split--disabled]="sending() || recording() || (!text.trim() && !pendingVoice() && !pendingFile())"
      >
        <button
          type="submit"
          class="sc-send-main"
          [disabled]="sending() || recording() || (!text.trim() && !pendingVoice() && !pendingFile())"
          aria-label="Send message"
        >
          @if (sending()) {
            <span class="sc-send-spin"></span>
          } @else {
            <span class="material-icons" aria-hidden="true">send</span>
          }
        </button>
      </div>
    </div>
  </div>
</form>
@if (error()) {
  <p class="sc-error">{{ error() }}</p>
}
