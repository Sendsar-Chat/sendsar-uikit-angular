<form class="sc-composer" (ngSubmit)="submit()">
  <div class="sc-box">
    <textarea
      #messageInput
      class="sc-message-input"
      name="message"
      [(ngModel)]="text"
      (ngModelChange)="onTextChange()"
      [disabled]="sending()"
      placeholder="Enter to send Shift + Enter to add new line"
      rows="1"
      autocomplete="off"
      (keydown.enter)="onEnterKey($event)"
    ></textarea>

    @if (showEmojiPicker()) {
      <div
        class="sc-emoji-picker-wrap"
        [class.light-mode]="!isSystemDarkMode()"
        [class.dark-mode]="isSystemDarkMode()"
        (click)="$event.stopPropagation()"
      >
        <div class="sc-emoji-picker" role="dialog" aria-label="Emoji picker">
          @for (group of emojiGroups; track group.label) {
            <section class="sc-emoji-group">
              <p class="sc-emoji-group-title">{{ group.label }}</p>
              <div class="sc-emoji-grid">
                @for (emoji of group.emojis; track emoji) {
                  <button
                    type="button"
                    class="sc-emoji-option"
                    [title]="emoji"
                    (click)="pickEmoji(emoji)"
                  >
                    <sc-animated-emoji [emoji]="emoji" />
                  </button>
                }
              </div>
            </section>
          }
        </div>
      </div>
    }

    <input
      #fileInput
      type="file"
      hidden
      [disabled]="sending()"
      (change)="onFileSelected($event)"
    />

    <div class="sc-toolbar">
      <div class="sc-toolbar-left">
        <button
          type="button"
          class="sc-tool-btn"
          [class.sc-tool-btn--active]="showEmojiPicker()"
          title="Emoji"
          aria-label="Emoji picker"
          [attr.aria-expanded]="showEmojiPicker()"
          (click)="toggleEmojiPicker($event)"
        >
          <span class="material-icons" aria-hidden="true">mood</span>
        </button>

        <button
          type="button"
          class="sc-tool-btn"
          title="Attach"
          (click)="openFilePicker()"
          aria-label="Attach file"
          [disabled]="sending()"
        >
          <span class="material-icons" aria-hidden="true">attach_file</span>
        </button>

        <button type="button" class="sc-tool-btn" title="Voice message" aria-label="Voice message">
          <span class="material-icons" aria-hidden="true">mic</span>
        </button>

        <button type="button" class="sc-tool-btn" title="Video message" aria-label="Video message">
          <span class="material-icons" aria-hidden="true">videocam</span>
        </button>

      </div>

      <div class="sc-send-split" [class.sc-send-split--disabled]="sending() || !text.trim()">
        <button
          type="submit"
          class="sc-send-main"
          [disabled]="sending() || !text.trim()"
          aria-label="Send message"
        >
          @if (sending()) {
            <span class="sc-send-spin"></span>
          } @else {
            <span class="material-icons" aria-hidden="true">send</span>
          }
        </button>
      </div>
    </div>
  </div>
</form>
@if (error()) {
  <p class="sc-error">{{ error() }}</p>
}
