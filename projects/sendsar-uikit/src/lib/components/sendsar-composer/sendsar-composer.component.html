<form class="sc-composer" (ngSubmit)="submit()">
  @if (showAttach()) {
    <div class="sc-attach-panel">
      <label class="sc-attach-label">
        Image / file URL
        <input
          type="url"
          name="attachUrl"
          [(ngModel)]="attachUrl"
          placeholder="https://example.com/photo.jpg"
          [disabled]="sending() || !!pendingFile()"
        />
      </label>
      <label class="sc-file-btn">
        Upload image
        <input type="file" accept="image/*" hidden (change)="onFileSelected($event)" />
      </label>
      @if (pendingFile(); as file) {
        <div class="sc-pending">
          <img [src]="file.url" alt="" class="sc-pending-thumb" />
          <span>{{ file.filename }}</span>
          <button type="button" (click)="clearAttachment()">×</button>
        </div>
      }
    </div>
  }

  <div class="sc-row">
    <div class="sc-input-wrap">
      <button type="button" class="sc-inline-btn" title="Attach" (click)="toggleAttach()" aria-label="Attach file">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 6.5v9.25a4.25 4.25 0 1 1-8.5 0V5.75a2.75 2.75 0 1 1 5.5 0v9.5a1.25 1.25 0 1 1-2.5 0V6.5h1.5v8.75a2.75 2.75 0 1 0 5.5 0V5.75a4.25 4.25 0 1 0-8.5 0v10a5.75 5.75 0 1 0 11.5 0V6.5h-1.5Z"/></svg>
      </button>
      <input
        type="text"
        name="message"
        [(ngModel)]="text"
        (ngModelChange)="onTextChange()"
        [disabled]="sending()"
        placeholder="Your message"
        autocomplete="off"
      />
      <button type="button" class="sc-inline-btn" title="Voice message" aria-label="Voice message">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
      </button>
    </div>
    <button
      type="submit"
      class="sc-send-btn"
      [disabled]="sending() || (!text.trim() && !attachUrl.trim() && !pendingFile())"
      aria-label="Send message"
    >
      @if (sending()) {
        <span class="sc-send-spin"></span>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.4 20.6 17.2-8.6L3.4 3.4l2.5 7.3 6.1 1.8-6.1 1.8-2.5 7.3Z"/></svg>
      }
    </button>
  </div>
</form>
@if (error()) {
  <p class="sc-error">{{ error() }}</p>
}
